spring:
  application:
    name: cloudticket-server
  #私密信息保存在local.yml中
  profiles:
    active: local
  #选择默认HikariCP连接池,便于自定义观测性能
  datasource:
    driver-class-name: ${ck.datasource.driver-class-name}
    url: jdbc:mysql://${ck.datasource.host}:${ck.datasource.port}/${ck.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${ck.datasource.username}
    password: ${ck.datasource.password}

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl   # 开发期打印 SQL，压测前关闭
  global-config:
    banner: false

knife4j:
  enable: true

cloudticket:
  jwt:
    user:
      secret: ${cloudticket.jwt.user.secret}
      ttl-hours: 168        # 用户端 7 天
    merchant:
      secret: ${cloudticket.jwt.merchant.secret}
      ttl-hours: 360        # 主办方 15 天
    admin:
      secret: ${cloudticket.jwt.admin.secret}
      ttl-hours: 24         # 平台 1 天