spring:
  application:
    name: cloudticket-server
  #私密信息保存在local.yml中
  profiles:
    active: local
  #选择默认HikariCP连接池,便于自定义观测性能
  datasource:
    driver-class-name: ${ck.datasource.driver-class-name}
    url: jdbc:mysql://${ck.datasource.host}:${ck.datasource.port}/${ck.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${ck.datasource.username}
    password: ${ck.datasource.password}
  data:
    redis:
      host: ${ck.redis.host}
      port: ${ck.redis.port}
      database: ${ck.redis.database}
  threads:
    virtual:
      enabled: true


logging:
  pattern:
    # 控制台格式：时间 级别 [traceId] [线程] 类名 - 消息
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] [%thread] %logger{36} - %msg%n"
    # 文件格式：多一个日期（跨天排查方便）
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] [%thread] %logger{50} - %msg%n"
  file:
    name: logs/cloudticket.log       # ← 落盘位置
  logback:
    rollingpolicy:
      max-file-size: 50MB            # 单文件超 50MB 自动切
      max-history: 7                 # 只留 7 天
      total-size-cap: 500MB          # 总共最多占 500MB

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl   # 开发期打印 SQL，压测前关闭
  global-config:
    banner: false

knife4j:
  enable: false

cloudticket:
  ticket:
    secret: ${cloudticket.ticket.secret}   # 票码 HMAC-SHA256 密钥（≥32 字符，仅服务端持有）
  jwt:
    user:
      secret: ${cloudticket.jwt.user.secret}
      ttl-hours: 168        # 用户端 7 天
    merchant:
      secret: ${cloudticket.jwt.merchant.secret}
      ttl-hours: 360        # 主办方 15 天
    admin:
      secret: ${cloudticket.jwt.admin.secret}
      ttl-hours: 24         # 平台 1 天